## 1. 트레이딩 핵심 전략 (Trading Logic)

### 1.1 기본 설정

| 항목 | 설정값 | 설명 |
|------|--------|------|
| **거래 자산** | BTCUSDT | 비트코인 USDT 무기한 선물 |
| **거래소** | Bitget Futures | 비트겟 선물 거래소 |
| **기본 타임프레임** | 4시간봉 | 메인 분석 시간대 |
| **참조 타임프레임** | 1일봉, 1시간봉, 15분봉 | 다중 시간대 분석 |
| **거래 유형** | 스윙 트레이딩 | 수일 ~ 수주 보유 |

### 1.2 사용 보조지표

| 지표 | 설정값 | 용도 |
|------|--------|------|
| **EMA (지수이동평균)** | 13, 21, 50, 200 | 추세 확인 및 지지/저항 |
| **RSI** | 14 | 과매수/과매도, 다이버전스 |
| **MACD** | 12, 26, 9 | 모멘텀 및 크로스오버 |
| **OBV** | 기본값 | 거래량 기반 매집/분배 확인 |
| **거래량 MA** | 14 | 평균 거래량 비교 |

### 1.3 롱 포지션 진입 조건

> **모든 필수 조건 충족 + 추가 확인 2개 이상 시 진입**

#### 필수 조건 (AND 조건)

\`\`\`
1. [추세] 1일봉 EMA 50 위에 가격 위치
2. [추세] 4시간봉 EMA 13 > EMA 21 > EMA 50 (정배열)
3. [구조] 이전 스윙 로우보다 현재 저점이 높음 (Higher Low)
4. [거래량] 진입 캔들 거래량 > 14MA 평균
\`\`\`

#### 추가 확인 조건 (2개 이상 충족)

\`\`\`
1. [RSI] RSI 상승 다이버전스 발생 (가격 저점↓, RSI 저점↑)
2. [RSI] RSI 30 이하에서 반등 후 40 돌파
3. [MACD] MACD 히스토그램 양전환 또는 골든크로스
4. [OBV] OBV 상승 추세 유지
5. [캔들] 해머형, 장악형, 모닝스타 등 반전 캔들 출현
6. [구조] 저항선 돌파 후 지지로 리테스트 성공
\`\`\`

#### 진입 트리거

\`\`\`
- 4시간봉 캔들이 EMA 21 위에서 종가 마감
- 또는 저항선 돌파 + 다음 캔들 시가가 저항 위에서 시작
\`\`\`

### 1.4 숏 포지션 진입 조건

> **모든 필수 조건 충족 + 추가 확인 2개 이상 시 진입**

#### 필수 조건 (AND 조건)

\`\`\`
1. [추세] 1일봉 EMA 50 아래에 가격 위치
2. [추세] 4시간봉 EMA 13 < EMA 21 < EMA 50 (역배열)
3. [구조] 이전 스윙 하이보다 현재 고점이 낮음 (Lower High)
4. [거래량] 진입 캔들 거래량 > 14MA 평균
\`\`\`

#### 추가 확인 조건 (2개 이상 충족)

\`\`\`
1. [RSI] RSI 하락 다이버전스 발생 (가격 고점↑, RSI 고점↓)
2. [RSI] RSI 70 이상에서 하락 후 60 하향 돌파
3. [MACD] MACD 히스토그램 음전환 또는 데드크로스
4. [OBV] OBV 하락 추세 유지
5. [캔들] 슈팅스타, 하락장악형, 이브닝스타 등 반전 캔들 출현
6. [구조] 지지선 붕괴 후 저항으로 리테스트 실패
\`\`\`

#### 진입 트리거

\`\`\`
- 4시간봉 캔들이 EMA 21 아래에서 종가 마감
- 또는 지지선 붕괴 + 다음 캔들 시가가 지지 아래에서 시작
\`\`\`

### 1.5 청산 조건

#### 익절 (Take Profit)

| 방식 | 조건 | 비율 |
|------|------|------|
| **1차 익절** | R:R 1.5:1 도달 | 포지션 50% |
| **2차 익절** | R:R 2.5:1 도달 | 포지션 30% |
| **최종 익절** | 반전 신호 또는 R:R 4:1 | 잔여 20% |

#### 반전 신호 청산

\`\`\`
- 반대 방향 EMA 크로스오버 (데드/골든크로스)
- RSI 반대 다이버전스 발생
- 강한 거래량과 함께 반대 방향 장악형 캔들
- MACD 반대 크로스오버
\`\`\`

#### 손절 (Stop Loss)

\`\`\`
- 진입 시 설정한 무효화 지점(Invalidation Level) 도달
- 기본: 진입가 대비 스윙 로우/하이 + 버퍼(0.5%)
\`\`\`

### 1.6 진입 회피 조건

> **아래 조건 중 하나라도 해당 시 진입하지 않음**

\`\`\`
1. [변동성] 최근 24시간 변동성이 평균의 3배 이상 (급등락 구간)
2. [추세] 1일봉 EMA 50과 200 사이에 가격 위치 (불확실 구간)
3. [거래량] 최근 4시간 평균 거래량이 14MA의 50% 미만
4. [구조] 명확한 지지/저항 구간 없음 (횡보장)
5. [손익비] 예상 R:R이 1.5:1 미만
6. [기존 포지션] 이미 최대 동시 포지션 수 도달
\`\`\`

## 2. 리스크 및 자금 관리 (Risk Management)

### 2.1 자본 관리

| 항목 | 설정값 | 설명 |
|------|--------|------|
| **1회 최대 리스크** | 2% | 1회 거래당 최대 손실 허용 비율 |
| **1일 최대 손실** | 5% | 일일 최대 손실 한도 (도달 시 당일 거래 중단) |
| **주간 최대 손실** | 10% | 주간 최대 손실 한도 (도달 시 주간 거래 중단) |
| **총 자본 보호** | 70% | 총 자본의 30% 손실 시 시스템 완전 중단 |

### 2.2 레버리지 설정

| 항목 | 설정값 | 설명 |
|------|--------|------|
| **기본 레버리지** | 5x | 일반 시장 상황 |
| **저변동성 레버리지** | 10x | ATR 기준 낮은 변동성 |
| **고변동성 레버리지** | 3x | ATR 기준 높은 변동성 |
| **마진 모드** | 격리 (Isolated) | 포지션별 마진 분리 |

### 2.3 포지션 사이징

\`\`\`
포지션 크기 = (계좌 잔고 × 리스크 비율) ÷ (진입가 - 스탑로스가)

예시:
- 계좌 잔고: $10,000
- 리스크 비율: 2% = $200
- 진입가: $50,000
- 스탑로스가: $49,000 (2% 하락)
- 포지션 크기: $200 ÷ $1,000 = 0.2 BTC
- 레버리지 5x 적용 시 필요 마진: $2,000
\`\`\`

### 2.4 손절 설정 규칙

| 조건 | 손절 위치 | 설명 |
|------|----------|------|
| **기본** | 스윙 로우/하이 + 0.5% 버퍼 | 기술적 무효화 지점 |
| **최대** | 진입가 대비 3% | 어떤 경우에도 초과 금지 |
| **트레일링** | 고점/저점 대비 1.5% | 수익 보호용 |

### 2.5 익절 설정 규칙

| 단계 | 조건 | 청산 비율 | 남은 포지션 처리 |
|------|------|----------|-----------------|
| **1단계** | R:R 1.5:1 도달 | 50% | 손절을 본전으로 이동 |
| **2단계** | R:R 2.5:1 도달 | 30% | 트레일링 스탑 활성화 |
| **3단계** | 반전 신호 또는 R:R 4:1 | 잔여 전량 | - |

### 2.6 거래 제한

| 항목 | 설정값 | 설명 |
|------|--------|------|
| **최대 동시 포지션** | 1개 | 동시에 열 수 있는 포지션 수 |
| **1일 최대 거래** | 3회 | 일일 최대 진입 횟수 |
| **연속 손실 후 대기** | 3회 연속 손실 시 24시간 | 냉각 기간 |
| **주간 최대 거래** | 10회 | 주간 최대 진입 횟수 |

### 2.7 긴급 중단 조건

> **아래 조건 발생 시 모든 포지션 즉시 청산 + 신규 거래 중단**

\`\`\`
1. [손실] 1일 최대 손실(5%) 도달
2. [손실] 주간 최대 손실(10%) 도달
3. [손실] 3회 연속 손절
4. [시장] 15분 내 5% 이상 급등락 (Flash Crash/Pump)
5. [시스템] API 오류 3회 연속 발생
6. [수동] 사용자의 긴급 중단 명령
